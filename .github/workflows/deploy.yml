name: TalkUp BE CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 내 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 17 세팅하기
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: 깃허브 서버에서 빌드하기
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: 빌드된 jar 파일을 EC2로 전송하기
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "build/libs/TalkUp_BE-0.0.1-SNAPSHOT.jar"
          target: "~/deploy"
          strip_components: 2

      - name: 기존 서버 끄고 새 서버 켜기
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            PID=$(pgrep -x java)
            if [ -n "$PID" ]; then
              kill -15 $PID
              sleep 5
            fi
            
            cd ~/deploy
            nohup java -jar TalkUp_BE-0.0.1-SNAPSHOT.jar \
              --spring.config.location=classpath:/application.yaml,file:/home/ubuntu/BE/src/main/resources/application.yaml \
              > server.log 2>&1 < /dev/null &